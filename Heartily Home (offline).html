  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Baloo 2';\n  font-style: normal;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"d00ccc27-e84a-472e-bf9d-6d605b7ba855\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Baloo 2';\n  font-style: normal;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"abac2400-3cdd-428a-9ae9-d69bb4a20237\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Baloo 2';\n  font-style: normal;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"a7bdda13-c9dc-4fc0-b279-001400a279db\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n/* ═══════════════════════════════════════════════════════════\n   HEARTILY — SHARED DESIGN TOKENS\n   ═══════════════════════════════════════════════════════════ */\n:root {\n  --chalk:     #F9F8F7;\n  --chalk-2:   #EFEDE9;\n  --dusk:      #362B47;\n  --dusk-deep: #221B30;\n  --dusk-ink:  #14101D;\n  --marmalade: #FCB879;\n  --ember:     #FA6A74;\n  --mulberry:  #AA2163;\n  --grad:   linear-gradient(135deg, #AA2163 0%, #FA6A74 52%, #FCB879 100%);\n  --grad-h: linear-gradient(90deg,  #AA2163 0%, #FA6A74 52%, #FCB879 100%);\n  --display: 'Baloo 2', system-ui, sans-serif;\n  --serif:   'Instrument Serif', Georgia, serif;\n  --ease:    cubic-bezier(0.25, 0.46, 0.45, 0.94);\n}\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml { scroll-behavior: smooth; }\nbody {\n  font-family: var(--display);\n  color: var(--dusk);\n  background: var(--chalk);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  overflow-x: hidden;\n}\nimg, svg { display: block; max-width: 100%; }\nbutton, a { font: inherit; color: inherit; cursor: pointer; }\nbutton { background: none; border: 0; }\na { text-decoration: none; }\nem { font-style: italic; }\nh1, h2, h3, h4 {\n  font-family: var(--display);\n  font-weight: 200;\n  letter-spacing: -0.02em;\n  line-height: 1.05;\n}\n.serif  { font-family: var(--serif); font-style: normal; }\n.italic { font-family: var(--serif); font-style: italic; }\n.grad-text {\n  background: var(--grad);\n  -webkit-background-clip: text;\n  background-clip: text;\n  -webkit-text-fill-color: transparent;\n  color: transparent;\n}\n.eyebrow {\n  font-family: var(--display);\n  font-size: 10px;\n  font-weight: 300;\n  letter-spacing: 0.28em;\n  text-transform: uppercase;\n  opacity: 0.55;\n}\n\n/* ═══════════════════════════════════════════════════════════\n   SHARED NAV\n   ═══════════════════════════════════════════════════════════ */\n.nav {\n  position: fixed;\n  inset: 0 0 auto 0;\n  height: 64px;\n  padding: 0 clamp(20px, 4vw, 56px);\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  z-index: 100;\n  transition: background 0.4s var(--ease), backdrop-filter 0.4s var(--ease), border-color 0.4s var(--ease);\n  border-bottom: 1px solid transparent;\n}\n.nav.scrolled {\n  background: rgba(20, 16, 29, 0.78);\n  backdrop-filter: blur(18px);\n  -webkit-backdrop-filter: blur(18px);\n  border-bottom-color: rgba(249, 248, 247, 0.06);\n}\n.nav.scrolled-light {\n  background: rgba(249, 248, 247, 0.82);\n  backdrop-filter: blur(18px);\n  border-bottom-color: rgba(54, 43, 71, 0.06);\n}\n.nav-brand {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  color: var(--chalk);\n  transition: color 0.4s var(--ease);\n}\n.nav.scrolled-light .nav-brand { color: var(--dusk); }\n.nav-brand .mark { width: 22px; height: 28px; }\n.nav-brand .word { width: 92px; }\n.nav-brand .word, .nav-brand .word path { fill: currentColor; }\n.nav-pills {\n  display: flex;\n  align-items: center;\n  gap: 4px;\n  padding: 4px;\n  border-radius: 999px;\n  border: 1px solid rgba(249, 248, 247, 0.12);\n  background: rgba(249, 248, 247, 0.02);\n  transition: border-color 0.4s var(--ease), background 0.4s var(--ease);\n}\n.nav.scrolled-light .nav-pills { border-color: rgba(54, 43, 71, 0.12); background: rgba(54, 43, 71, 0.02); }\n.nav-pill {\n  padding: 8px 14px;\n  border-radius: 999px;\n  font-size: 11px;\n  font-weight: 300;\n  letter-spacing: 0.08em;\n  color: rgba(249, 248, 247, 0.62);\n  transition: all 0.25s var(--ease);\n  white-space: nowrap;\n}\n.nav.scrolled-light .nav-pill { color: rgba(54, 43, 71, 0.58); }\n.nav-pill:hover { color: var(--chalk); background: rgba(249, 248, 247, 0.06); }\n.nav.scrolled-light .nav-pill:hover { color: var(--dusk); background: rgba(54, 43, 71, 0.05); }\n.nav-pill.active {\n  background: var(--grad-h);\n  color: var(--dusk-deep);\n  font-weight: 400;\n}\n.nav-pill.active:hover { color: var(--dusk-deep); }\n.nav-pills-mobile {\n  display: none;\n}\n@media (max-width: 720px) {\n  .nav-pill { padding: 6px 10px; font-size: 10px; letter-spacing: 0.06em; }\n}\n@media (max-width: 480px) {\n  .nav { padding: 0 14px; }\n  .nav-brand .word { display: none; }\n  .nav-pills { gap: 0; padding: 3px; flex-wrap: nowrap; }\n  .nav-pill { padding: 6px 9px; font-size: 9.5px; letter-spacing: 0.04em; }\n}\n\n/* ═══════════════════════════════════════════════════════════\n   SECTIONS\n   ═══════════════════════════════════════════════════════════ */\nsection {\n  position: relative;\n  padding: clamp(80px, 11vh, 140px) clamp(20px, 5vw, 80px);\n  overflow: hidden;\n}\n.bg-deep   { background: var(--dusk-deep); color: var(--chalk); }\n.bg-ink    { background: var(--dusk-ink);  color: var(--chalk); }\n.bg-dusk   { background: var(--dusk);      color: var(--chalk); }\n.bg-chalk  { background: var(--chalk);     color: var(--dusk); }\n.bg-chalk h1, .bg-chalk h2, .bg-chalk h3, .bg-chalk h4 { color: var(--dusk); }\n\n.inner {\n  max-width: 1240px;\n  margin: 0 auto;\n  position: relative;\n}\n.inner-narrow {\n  max-width: 760px;\n  margin: 0 auto;\n  position: relative;\n}\n\n/* Reveal animation */\n.reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.9s var(--ease), transform 0.9s var(--ease); }\n.reveal.in { opacity: 1; transform: translateY(0); }\n\n/* Brand mark texture */\n.mark-texture {\n  position: absolute;\n  pointer-events: none;\n  opacity: 0.05;\n  width: 50vw;\n  max-width: 720px;\n  right: -8vw;\n  bottom: -8vw;\n  z-index: 0;\n}\n\n/* CTAs */\n.cta-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }\n.cta {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  padding: 14px 24px;\n  border-radius: 8px;\n  font-family: var(--display);\n  font-size: 13px;\n  font-weight: 300;\n  letter-spacing: 0.04em;\n  transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), background 0.25s var(--ease);\n}\n.cta-primary {\n  background: var(--grad-h);\n  color: var(--dusk-deep);\n  border: 0;\n  font-weight: 400;\n}\n.cta-primary:hover {\n  transform: translateY(-2px);\n  box-shadow: 0 12px 30px -10px rgba(250, 106, 116, 0.5);\n}\n.cta-secondary {\n  position: relative;\n  background: transparent;\n  color: var(--chalk);\n  border: 1.5px solid transparent;\n  background-image: linear-gradient(var(--dusk-deep), var(--dusk-deep)), var(--grad-h);\n  background-origin: border-box;\n  background-clip: padding-box, border-box;\n}\n.bg-chalk .cta-secondary {\n  background-image: linear-gradient(var(--chalk), var(--chalk)), var(--grad-h);\n  color: var(--dusk);\n}\n.cta-secondary:hover { transform: translateY(-2px); }\n.cta-secondary .grad-text { background: var(--grad-h); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n\n/* ═══════════════════════════════════════════════════════════\n   HERO\n   ═══════════════════════════════════════════════════════════ */\n.hero {\n  min-height: 100vh;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  padding-top: 120px;\n  padding-bottom: 120px;\n}\n.hero::before, .hero::after {\n  content: \"\";\n  position: absolute;\n  border-radius: 50%;\n  filter: blur(80px);\n  pointer-events: none;\n}\n.hero::before {\n  width: 60vw; height: 60vw;\n  left: -18vw; top: -20vw;\n  background: radial-gradient(circle, rgba(170, 33, 99, 0.35) 0%, transparent 60%);\n  animation: breathe1 16s ease-in-out infinite;\n}\n.hero::after {\n  width: 55vw; height: 55vw;\n  right: -20vw; bottom: -20vw;\n  background: radial-gradient(circle, rgba(252, 184, 121, 0.22) 0%, transparent 60%);\n  animation: breathe2 20s ease-in-out infinite;\n}\n@keyframes breathe1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px,30px) scale(1.08); } }\n@keyframes breathe2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-30px,-40px) scale(1.12); } }\n\n.hero-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }\n\n.hero-mark {\n  width: clamp(96px, 11vw, 168px);\n  height: auto;\n  margin-bottom: 44px;\n  opacity: 0;\n  animation: markEnter 1.5s var(--ease) 0.2s forwards, markFloat 6s ease-in-out 1.7s infinite;\n}\n@keyframes markEnter {\n  from { opacity: 0; transform: scale(0.95); }\n  to   { opacity: 1; transform: scale(1); }\n}\n@keyframes markFloat {\n  0%,100% { transform: translateY(0) scale(1); }\n  50%     { transform: translateY(-12px) scale(1.02); }\n}\n\n.hero-lockup {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  margin-bottom: 56px;\n  opacity: 0;\n  animation: fadeUp 1s var(--ease) 1s forwards;\n}\n.hero-lockup .mark { width: 26px; height: 34px; }\n.hero-lockup .word { width: 132px; }\n.hero-lockup .word, .hero-lockup .word path { fill: var(--chalk); }\n\n@keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }\n\n.hero-statement {\n  font-family: var(--display);\n  font-weight: 100;\n  font-size: clamp(40px, 7vw, 108px);\n  line-height: 0.98;\n  letter-spacing: -0.04em;\n  color: var(--chalk);\n  max-width: 1040px;\n  margin-bottom: 30px;\n  opacity: 0;\n  animation: fadeUp 1s var(--ease) 1.4s forwards;\n  text-wrap: balance;\n}\n.hero-statement .line2 { display: block; }\n.hero-statement em {\n  font-family: var(--serif);\n  font-style: italic;\n  font-weight: 400;\n  letter-spacing: -0.02em;\n}\n.hero-subline {\n  font-family: var(--display);\n  font-weight: 200;\n  font-size: clamp(15px, 1.3vw, 19px);\n  letter-spacing: 0.02em;\n  color: rgba(249, 248, 247, 0.55);\n  margin-bottom: 36px;\n  opacity: 0;\n  animation: fadeUp 1s var(--ease) 1.8s forwards;\n}\n.hero-rule {\n  width: 80px;\n  height: 1px;\n  background: var(--grad-h);\n  margin-bottom: 36px;\n  opacity: 0;\n  animation: fadeUp 1s var(--ease) 2.05s forwards;\n  position: relative;\n  overflow: hidden;\n}\n.hero-rule::after {\n  content: \"\";\n  position: absolute; inset: 0;\n  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);\n  animation: shimmer 4s linear 2.5s infinite;\n}\n@keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }\n\n.hero-blurb {\n  font-family: var(--serif);\n  font-size: clamp(17px, 1.4vw, 21px);\n  line-height: 1.55;\n  color: rgba(249, 248, 247, 0.7);\n  max-width: 540px;\n  margin-bottom: 60px;\n  opacity: 0;\n  animation: fadeUp 1s var(--ease) 2.25s forwards;\n}\n\n.scroll-cue {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 10px;\n  opacity: 0;\n  animation: fadeUp 1s var(--ease) 2.7s forwards;\n}\n.scroll-cue-text {\n  font-size: 9px;\n  font-weight: 300;\n  letter-spacing: 0.3em;\n  text-transform: uppercase;\n  color: rgba(249, 248, 247, 0.4);\n}\n.scroll-cue-line {\n  width: 1px;\n  height: 44px;\n  background: linear-gradient(to bottom, transparent, rgba(252, 184, 121, 0.8), transparent);\n  animation: scrollPulse 2.4s ease-in-out infinite;\n}\n@keyframes scrollPulse {\n  0%, 100% { transform: scaleY(0.6); opacity: 0.5; }\n  50% { transform: scaleY(1); opacity: 1; }\n}\n\n/* ═══════════════════════════════════════════════════════════\n   CORE IDEA SECTION\n   ═══════════════════════════════════════════════════════════ */\n.core-idea { padding-top: clamp(120px, 16vh, 200px); padding-bottom: clamp(120px, 16vh, 200px); }\n.core-idea .eyebrow { color: var(--mulberry); opacity: 1; margin-bottom: 40px; }\n.core-idea-text {\n  font-family: var(--serif);\n  font-size: clamp(22px, 2.4vw, 34px);\n  line-height: 1.45;\n  color: var(--dusk);\n  max-width: 780px;\n  margin: 0 auto;\n  text-align: center;\n  text-wrap: balance;\n}\n.core-idea-text + .core-idea-text { margin-top: 28px; }\n.core-idea-text em { font-family: var(--serif); font-style: italic; }\n.core-callout {\n  margin-top: 80px;\n  font-family: var(--display);\n  font-weight: 200;\n  font-size: clamp(28px, 4.2vw, 58px);\n  letter-spacing: -0.02em;\n  line-height: 1.1;\n  text-align: center;\n  text-wrap: balance;\n  max-width: 1000px;\n  margin-left: auto;\n  margin-right: auto;\n}\n.core-callout em { font-family: var(--serif); font-style: italic; font-weight: 400; }\n\n/* ═══════════════════════════════════════════════════════════\n   NUMBERS\n   ═══════════════════════════════════════════════════════════ */\n.numbers { padding-top: clamp(100px, 14vh, 160px); padding-bottom: clamp(100px, 14vh, 160px); }\n.numbers .inner { display: flex; flex-direction: column; align-items: center; }\n.numbers-row {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: clamp(40px, 6vw, 100px);\n  width: 100%;\n  margin-bottom: 80px;\n}\n@media (max-width: 760px) {\n  .numbers-row { grid-template-columns: 1fr; gap: 60px; }\n}\n.number-block {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  text-align: center;\n  position: relative;\n}\n.number-block + .number-block::before {\n  content: \"\";\n  position: absolute;\n  left: calc(-1 * clamp(20px, 3vw, 50px));\n  top: 12%;\n  bottom: 12%;\n  width: 1px;\n  background: linear-gradient(to bottom, transparent, rgba(249, 248, 247, 0.12), transparent);\n}\n@media (max-width: 760px) {\n  .number-block + .number-block::before { display: none; }\n}\n.number-mega {\n  font-family: var(--display);\n  font-weight: 100;\n  font-size: clamp(80px, 13vw, 200px);\n  line-height: 0.9;\n  letter-spacing: -0.05em;\n  background: var(--grad);\n  -webkit-background-clip: text;\n  background-clip: text;\n  -webkit-text-fill-color: transparent;\n  margin-bottom: 18px;\n}\n.number-label {\n  font-family: var(--serif);\n  font-size: clamp(15px, 1.3vw, 19px);\n  line-height: 1.45;\n  color: rgba(249, 248, 247, 0.7);\n  max-width: 280px;\n}\n.number-label em { font-style: italic; }\n.numbers-coda {\n  font-family: var(--serif);\n  font-style: italic;\n  font-size: clamp(20px, 1.8vw, 26px);\n  line-height: 1.4;\n  color: rgba(249, 248, 247, 0.6);\n  text-align: center;\n  max-width: 640px;\n}\n\n/* ═══════════════════════════════════════════════════════════\n   ROUTING CARDS\n   ═══════════════════════════════════════════════════════════ */\n.routing { padding-top: clamp(100px, 14vh, 160px); padding-bottom: clamp(120px, 16vh, 180px); }\n.routing-head {\n  text-align: center;\n  margin-bottom: 80px;\n}\n.routing-h {\n  font-size: clamp(34px, 4.2vw, 58px);\n  line-height: 1.06;\n  letter-spacing: -0.02em;\n  font-weight: 200;\n  max-width: 800px;\n  margin: 22px auto 0;\n  text-wrap: balance;\n}\n.routing-h em { font-family: var(--serif); font-style: italic; font-weight: 400; }\n.cards-grid {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 20px;\n}\n@media (max-width: 980px) {\n  .cards-grid { grid-template-columns: 1fr; max-width: 520px; margin: 0 auto; }\n}\n.route-card {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  border-radius: 16px;\n  padding: 36px 32px 32px;\n  overflow: hidden;\n  transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);\n}\n.route-card:hover {\n  transform: translateY(-4px);\n  box-shadow: 0 24px 60px -20px rgba(34, 27, 48, 0.18);\n}\n.route-card .icon-wrap {\n  width: 56px;\n  height: 56px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  margin-bottom: 36px;\n}\n.route-card .icon-wrap svg { width: 100%; height: auto; }\n.route-card h3 {\n  font-family: var(--display);\n  font-weight: 300;\n  font-size: clamp(22px, 2vw, 28px);\n  margin-bottom: 14px;\n  letter-spacing: -0.01em;\n}\n.route-card h3 em { font-family: var(--serif); font-style: italic; font-weight: 400; }\n.route-card p {\n  font-family: var(--serif);\n  font-size: 17px;\n  line-height: 1.5;\n  margin-bottom: 32px;\n  flex: 1;\n}\n.route-cta {\n  font-family: var(--display);\n  font-size: 12px;\n  font-weight: 400;\n  letter-spacing: 0.06em;\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  padding-top: 22px;\n  border-top: 1px solid currentColor;\n  border-color: rgba(255,255,255,0.18);\n  transition: gap 0.25s var(--ease);\n}\n.route-card:hover .route-cta { gap: 14px; }\n\n.route-dusk { background: var(--dusk); color: var(--chalk); }\n.route-dusk .icon-wrap svg path,\n.route-dusk .icon-wrap svg circle,\n.route-dusk .icon-wrap svg rect { stroke: var(--chalk); }\n.route-dusk p { color: rgba(249, 248, 247, 0.75); }\n.route-dusk .route-cta { border-color: rgba(249, 248, 247, 0.18); color: var(--chalk); }\n\n.route-chalk { background: var(--chalk); color: var(--dusk); border: 1px solid rgba(54, 43, 71, 0.12); }\n.route-chalk .icon-wrap svg path,\n.route-chalk .icon-wrap svg circle,\n.route-chalk .icon-wrap svg rect { stroke: var(--dusk); }\n.route-chalk p { color: rgba(54, 43, 71, 0.75); }\n.route-chalk .route-cta { border-color: rgba(54, 43, 71, 0.18); color: var(--dusk); }\n\n.route-grad {\n  background: var(--grad);\n  color: var(--dusk-deep);\n  position: relative;\n}\n.route-grad::after {\n  content: \"\";\n  position: absolute; inset: 0;\n  background: radial-gradient(ellipse at top right, rgba(255,255,255,0.18), transparent 60%);\n  pointer-events: none;\n}\n.route-grad .icon-wrap svg path,\n.route-grad .icon-wrap svg circle,\n.route-grad .icon-wrap svg rect { stroke: var(--dusk-deep); }\n.route-grad p { color: rgba(34, 27, 48, 0.8); position: relative; z-index: 1; }\n.route-grad h3, .route-grad .icon-wrap, .route-grad .route-cta { position: relative; z-index: 1; }\n.route-grad .route-cta { border-color: rgba(34, 27, 48, 0.25); color: var(--dusk-deep); }\n\n/* ═══════════════════════════════════════════════════════════\n   PLATFORM PREVIEW\n   ═══════════════════════════════════════════════════════════ */\n.platform { padding-top: clamp(100px, 14vh, 160px); padding-bottom: clamp(100px, 14vh, 160px); }\n.platform .inner { display: flex; flex-direction: column; align-items: center; text-align: center; }\n.platform .eyebrow { color: var(--marmalade); opacity: 1; margin-bottom: 32px; }\n\n.preview-frame {\n  width: 100%;\n  max-width: 920px;\n  aspect-ratio: 16 / 10;\n  border-radius: 18px;\n  border: 1px solid rgba(249, 248, 247, 0.1);\n  background: linear-gradient(180deg, #1a1428 0%, #251c36 100%);\n  position: relative;\n  overflow: hidden;\n  margin-bottom: 36px;\n  box-shadow: 0 40px 80px -30px rgba(0,0,0,0.6), 0 0 0 1px rgba(250, 106, 116, 0.08) inset;\n}\n.preview-chrome {\n  height: 36px;\n  border-bottom: 1px solid rgba(249, 248, 247, 0.06);\n  display: flex;\n  align-items: center;\n  padding: 0 14px;\n  gap: 6px;\n  background: rgba(0,0,0,0.18);\n}\n.preview-dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(249,248,247,0.16); }\n.preview-body {\n  padding: clamp(20px, 4vw, 56px);\n  height: calc(100% - 36px);\n  display: grid;\n  grid-t s<\u002Fa>\n    <a class=\"nav-pill\" href=\"Heartily Pitch Deck.html\">Investors<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- ═══════ HERO ═══════ -->\n<section class=\"hero bg-ink\" data-screen-label=\"01 Hero\">\n  <div class=\"hero-inner\">\n    <svg class=\"hero-mark\" viewBox=\"0 0 1121.86 1461.37\" aria-hidden=\"true\"><use href=\"#brand-mark\"><\u002Fuse><\u002Fsvg>\n\n    <div class=\"hero-lockup\">\n      <svg class=\"mark\" viewBox=\"0 0 1121.86 1461.37\" aria-hidden=\"true\"><use href=\"#brand-mark\"><\u002Fuse><\u002Fsvg>\n      <svg class=\"word\" viewBox=\"0 0 589.92 190.3\" aria-label=\"heartily\"><use href=\"#brand-wordmark\"><\u002Fuse><\u002Fsvg>\n    <\u002Fdiv>\n\n    <div class=\"hero-statement\">\n      Are you working hard?\n      <span class=\"line2\">Or <em>heartily<\u002Fem> working?<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"hero-subline\">There's a difference.<\u002Fdiv>\n\n    <div class=\"hero-rule\"><\u002Fdiv>\n\n    <p class=\"hero-blurb italic\">\n      Heartily helps students find the work they would do with their whole heart — before they commit to a path. And connects them to the employers and schools that make that possible.\n    <\u002Fp>\n\n    <div class=\"scroll-cue\">\n      <span class=\"scroll-cue-text\">Scroll<\u002Fspan>\n      <span class=\"scroll-cue-line\"><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════ CORE IDEA ═══════ -->\n<section class=\"bg-chalk core-idea\" data-screen-label=\"02 Core idea\">\n  <div class=\"inner-narrow\">\n    <p class=\"eyebrow reveal\" style=\"text-align:center;\">The idea<\u002Fp>\n    <p class=\"core-idea-text reveal\">\n      Most people spend their lives working hard at the wrong thing. Not because they lacked ability or ambition — because nobody helped them find the work worth doing <em>heartily<\u002Fem>. With full investment. Genuine care. The sense that what they're doing matters.\n    <\u002Fp>\n    <p class=\"core-idea-text reveal\">\n      Heartily is built to change that. It gives students honest access to what real careers look and feel like, helps them understand what genuinely energizes them, and maps transparent paths forward. Then it connects them — to programs, to schools, to employers who want people who chose their field with open eyes.\n    <\u002Fp>\n    <div class=\"core-callout reveal\">\n      Every career is a craft.<br>Find the one you'd do <em class=\"grad-text\">heartily<\u002Fem>.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════ THE NUMBERS ═══════ -->\n<section class=\"bg-dusk numbers\" data-screen-label=\"03 Numbers\">\n  <div class=\"inner\">\n    <div class=\"numbers-row\">\n      <div class=\"number-block reveal\">\n        <div class=\"number-mega\" data-count=\"21\" data-suffix=\"%\">0%<\u002Fdiv>\n        <p class=\"number-label\">of employees worldwide are <em>engaged<\u002Fem> at work.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"number-block reveal\" style=\"transition-delay:120ms;\">\n        <div class=\"number-mega\" data-count=\"8.8\" data-prefix=\"$\" data-suffix=\"T\" data-decimals=\"1\">$0T<\u002Fdiv>\n        <p class=\"number-label\">lost globally each year to disengagement.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"number-block reveal\" style=\"transition-delay:240ms;\">\n        <div class=\"number-mega\" data-count=\"17\" data-suffix=\"\">0<\u002Fdiv>\n        <p class=\"number-label\">the age when most career decisions get <em>made<\u002Fem>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"numbers-coda reveal\" style=\"transition-delay:360ms;\">The problem starts upstream. <em>Heartily works upstream.<\u002Fem><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════ ROUTING ═══════ -->\n<section class=\"bg-chalk routing\" data-screen-label=\"04 Who it's for\">\n  <div class=\"inner\">\n    <div class=\"routing-head\">\n      <p class=\"eyebrow reveal\">Who Heartily is for<\u002Fp>\n      <h2 class=\"routing-h reveal\" style=\"transition-delay:100ms;\">\n        Heartily works for <em>everyone<\u002Fem><br>in the equation.\n      <\u002Fh2>\n    <\u002Fdiv>\n\n    <div class=\"cards-grid\">\n      <!-- Card 1: Students -->\n      <a class=\"route-card route-dusk reveal\" href=\"heartily-students.html\" style=\"transition-delay:200ms;\">\n        <div class=\"icon-wrap\" aria-hidden=\"true\">\n          <!-- mark with outward glow -->\n          <svg viewBox=\"0 0 64 64\" fill=\"none\">\n            <circle cx=\"32\" cy=\"32\" r=\"28\" stroke=\"currentColor\" stroke-opacity=\"0.18\" stroke-width=\"1\"><\u002Fcircle>\n            <circle cx=\"32\" cy=\"32\" r=\"22\" stroke=\"currentColor\" stroke-opacity=\"0.12\" stroke-width=\"1\"><\u002Fcircle>\n            <g transform=\"translate(20,16) scale(0.022)\">\n              <path fill=\"url(#heartily-grad)\" d=\"M520.52,1426.39c-134.99,31.11-490.59-434.88-480.39-679.54C57.36,333.66,723.53-94.24,698.49,78.98c-108.7,751.85,349.07,301.23,392.8,698.68,27.74,252.14-407.43,667.07-570.77,648.73Z\"><\u002Fpath>\n            <\u002Fg>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <h3>For students &amp; <em>families<\u002Fem><\u002Fh3>\n        <p>Find out what careers actually feel like before you commit to one. Free, honest, and built around what you'd genuinely do heartily — not what pays well or sounds impressive.<\u002Fp>\n        <span class=\"route-cta\">Explore as a student <span aria-hidden=\"true\">→<\u002Fspan><\u002Fspan>\n      <\u002Fa>\n\n      <!-- Card 2: Schools -->\n      <a class=\"route-card route-chalk reveal\" href=\"heartily-admins.html\" style=\"transition-delay:320ms;\">\n        <div class=\"icon-wrap\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 64 64\" fill=\"none\" stroke-width=\"1.2\">\n            <rect x=\"10\" y=\"20\" width=\"44\" height=\"32\" rx=\"2\" stroke=\"currentColor\"><\u002Frect>\n            <path d=\"M10 20 L32 8 L54 20\" stroke=\"currentColor\"><\u002Fpath>\n            <path d=\"M22 52 V36 H42 V52\" stroke=\"currentColor\"><\u002Fpath>\n            <path d=\"M32 36 V52\" stroke=\"currentColor\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <h3>For schools &amp; <em>districts<\u002Fem><\u002Fh3>\n        <p>Give your students a career guidance tool they'll actually use. Heartily extends your guidance team's reach with honest career content, student interest data, and outcomes you can report.<\u002Fp>\n        <span class=\"route-cta\">Learn about partnerships <span aria-hidden=\"true\">→<\u002Fspan><\u002Fspan>\n      <\u002Fa>\n\n      <!-- Card 3: Employers -->\n      <a class=\"route-card route-grad reveal\" href=\"heartily-employers.html\" style=\"transition-delay:440ms;\">\n        <div class=\"icon-wrap\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 64 64\" fill=\"none\" stroke-width=\"1.4\">\n            <path d=\"M14 28 L32 14 L50 28\" stroke=\"currentColor\"><\u002Fpath>\n            <path d=\"M14 28 V52 H50 V28\" stroke=\"currentColor\"><\u002Fpath>\n            <circle cx=\"32\" cy=\"40\" r=\"6\" stroke=\"currentColor\"><\u002Fcircle>\n            <path d=\"M26 52 Q32 46 38 52\" stroke=\"currentColor\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <h3>For <em>employers<\u002Fem><\u002Fh3>\n        <p>A talent pipeline built on genuine interest, not cold applications. Heartily candidates have already spent weeks understanding what your industry actually involves. They chose your field with open eyes.<\u002Fp>\n        <span class=\"route-cta\">See how the pipeline works <span aria-hidden=\"true\">→<\u002Fspan><\u002Fspan>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════ PLATFORM PREVIEW ═══════ -->\n<section class=\"bg-ink platform\" data-screen-label=\"05 Platform preview\">\n  <div class=\"inner\">\n    <p class=\"eyebrow reveal\">The platform<\u002Fp>\n    <h2 class=\"reveal\" style=\"font-size:clamp(28px,3.4vw,46px); margin: 20px 0 60px; font-weight:200; text-align:center;\">One question, asked seriously, again and again.<\u002Fh2>\n\n    <div class=\"preview-frame reveal\" style=\"transition-delay:200ms;\">\n      <div class=\"preview-chrome\">\n        <span class=\"preview-dot\"><\u002Fspan>\n        <span class=\"preview-dot\"><\u002Fspan>\n        <span class=\"preview-dot\"><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"preview-body\">\n        <div>\n          <div class=\"preview-meta\">Master Electrician · Tuesday<\u002Fdiv>\n          <p class=\"preview-question\">\n            <em>Would you do this<\u002Fem><br>heartily?\n          <\u002Fp>\n          <div class=\"preview-choices\">\n            <div class=\"preview-choice\"><span class=\"dot\"><\u002Fspan>No — not for me<\u002Fdiv>\n            <div class=\"preview-choice\"><span class=\"dot\"><\u002Fspan>Not sure yet<\u002Fdiv>\n            <div class=\"preview-choice selected\"><span class=\"dot\"><\u002Fspan>Yes — I'd be glad to<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"preview-card-wrap\">\n          <div class=\"career-card\">\n            <div class=\"career-card-tag\">Skilled Trade<\u002Fdiv>\n            <div class=\"career-card-title\">Master Electrician<\u002Fdiv>\n            <div class=\"career-card-sub italic\">Solo problem-solving, done by 5pm<\u002Fdiv>\n            <div class=\"career-card-stats\">\n              <div>\n                <div class=\"career-stat-label\">Autonomy<\u002Fdiv>\n                <div class=\"career-stat-bar\"><div class=\"career-stat-fill\" style=\"--w:82%;\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div class=\"career-stat-label\">Meaning<\u002Fdiv>\n                <div class=\"career-stat-bar\"><div class=\"career-stat-fill\" style=\"--w:74%;\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div class=\"career-stat-label\">Pay range<\u002Fdiv>\n                <div class=\"career-stat-bar\"><div class=\"career-stat-fill\" style=\"--w:60%;\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div class=\"career-stat-label\">Day length<\u002Fdiv>\n                <div class=\"career-stat-bar\"><div class=\"career-stat-fill\" style=\"--w:45%;\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"career-card-meta\">7yr path · journeyman → master. Apprenticeship-paid, not student-debt-funded.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p class=\"platform-caption reveal\" style=\"transition-delay:300ms;\">\n      <em>What a Tuesday actually feels like — before you decide it's the right one.<\u002Fem>\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════ CLOSING ═══════ -->\n<section class=\"closing\" data-screen-label=\"06 Closing\">\n  <div class=\"inner\">\n    <svg class=\"closing-mark\" viewBox=\"0 0 1121.86 1461.37\" aria-hidden=\"true\">\n      <path d=\"M520.52,1426.39c-134.99,31.11-490.59-434.88-480.39-679.54C57.36,333.66,723.53-94.24,698.49,78.98c-108.7,751.85,349.07,301.23,392.8,698.68,27.74,252.14-407.43,667.07-570.77,648.73Z\"><\u002Fpath>\n    <\u002Fsvg>\n    <svg class=\"closing-wordmark\" viewBox=\"0 0 589.92 190.3\" aria-label=\"heartily\"><use href=\"#brand-wordmark\"><\u002Fuse><\u002Fsvg>\n    <p class=\"closing-tag\"><em>Find the work you'd do<br>with your whole heart.<\u002Fem><\u002Fp>\n    <div class=\"closing-addr\">HEARTILY.WORK<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════ FOOTER ═══════ -->\n<footer class=\"footer\">\n  <a href=\"heartily-home.html\" class=\"footer-lockup\">\n    <svg class=\"mark\" viewBox=\"0 0 1121.86 1461.37\" aria-hidden=\"true\"><use href=\"#brand-mark\"><\u002Fuse><\u002Fsvg>\n    <svg class=\"word\" viewBox=\"0 0 589.92 190.3\" aria-label=\"heartily\"><use href=\"#brand-wordmark\"><\u002Fuse><\u002Fsvg>\n  <\u002Fa>\n  <div class=\"footer-addr\">HEARTILY.WORK<\u002Fdiv>\n  <p class=\"footer-tag\"><em>Find the work you'd do with your whole heart.<\u002Fem><\u002Fp>\n  <div class=\"footer-rule\"><\u002Fdiv>\n  <div class=\"footer-links\">\n    <a href=\"heartily-students.html\">Students &amp; Families<\u002Fa>\n    <a href=\"heartily-admins.html\">School Administrators<\u002Fa>\n    <a href=\"heartily-employers.html\">Employers<\u002Fa>\n    <a href=\"Heartily Pitch Deck.html\">Investors<\u002Fa>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<!-- ═══════ FEEDBACK ═══════ -->\n<button class=\"fb-btn\" id=\"fbBtn\">Share feedback<\u002Fbutton>\n<div class=\"fb-overlay\" id=\"fbOverlay\" role=\"dialog\" aria-modal=\"true\">\n  <div class=\"fb-modal\">\n    <div id=\"fbForm\">\n      <h3>A few quick questions.<\u002Fh3>\n      <p class=\"fb-sub italic\">Help us make this clearer for the next person who lands here.<\u002Fp>\n      <div class=\"fb-q\">\n        <div class=\"fb-q-label\">Does this feel relevant to you?<\u002Fdiv>\n        <div class=\"fb-options\" data-q=\"relevance\">\n          <button class=\"fb-option\" data-v=\"Yes\">Yes<\u002Fbutton>\n          <button class=\"fb-option\" data-v=\"Somewhat\">Somewhat<\u002Fbutton>\n          <button class=\"fb-option\" data-v=\"No\">No<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fb-q\">\n        <div class=\"fb-q-label\">Most interesting thing on this page?<\u002Fdiv>\n        <input class=\"fb-input\" id=\"fbInteresting\" type=\"text\" placeholder=\"In a few words…\">\n      <\u002Fdiv>\n      <div class=\"fb-q\">\n        <div class=\"fb-q-label\">What's missing?<\u002Fdiv>\n        <input class=\"fb-input\" id=\"fbMissing\" type=\"text\" placeholder=\"In a few words…\">\n      <\u002Fdiv>\n      <div class=\"fb-actions\">\n        <button class=\"fb-close\" id=\"fbCancel\">Close<\u002Fbutton>\n        <button class=\"fb-submit\" id=\"fbSubmit\">Send<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"fbThanks\" style=\"display:none;\">\n      <p class=\"fb-thanks\"><em>Thank you. This goes straight to the team.<\u002Fem><\u002Fp>\n      <div class=\"fb-actions\" style=\"justify-content:center;\">\n        <button class=\"fb-close\" id=\"fbDone\">Close<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n/* ─── Nav scroll state ─── */\nconst nav = document.getElementById('nav');\nlet lightSections = null;\nfunction updateNavBg() {\n  const y = window.scrollY + 32;\n  const sections = document.querySelectorAll('section, footer');\n  let active = null;\n  sections.forEach(s => {\n    const r = s.getBoundingClientRect();\n    const top = r.top + window.scrollY;\n    if (y >= top && y < top + r.height) active = s;\n  });\n  nav.classList.toggle('scrolled', window.scrollY > 30);\n  nav.classList.toggle('scrolled-light', !!(active && active.classList.contains('bg-chalk')));\n}\nwindow.addEventListener('scroll', updateNavBg, { passive: true });\nupdateNavBg();\n\n/* ─── IntersectionObserver reveal ─── */\nconst io = new IntersectionObserver((entries) => {\n  entries.forEach((e) => {\n    if (e.isIntersecting) {\n      e.target.classList.add('in');\n      io.unobserve(e.target);\n    }\n  });\n}, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });\ndocument.querySelectorAll('.reveal').forEach((el) => io.observe(el));\n\n/* ─── Stat count-ups ─── */\nconst countEls = document.querySelectorAll('[data-count]');\nconst countIO = new IntersectionObserver((entries) => {\n  entries.forEach((e) => {\n    if (!e.isIntersecting) return;\n    const el = e.target;\n    const target = parseFloat(el.dataset.count);\n    const decimals = parseInt(el.dataset.decimals || '0', 10);\n    const prefix = el.dataset.prefix || '';\n    const suffix = el.dataset.suffix || '';\n    const dur = 1800;\n    const start = performance.now();\n    function tick(t) {\n      const p = Math.min(1, (t - start) / dur);\n      const eased = 1 - Math.pow(1 - p, 3);\n      const v = (target * eased).toFixed(decimals);\n      el.textContent = prefix + v + suffix;\n      if (p < 1) requestAnimationFrame(tick);\n    }\n    requestAnimationFrame(tick);\n    countIO.unobserve(el);\n  });\n}, { threshold: 0.5 });\ncountEls.forEach((el) => countIO.observe(el));\n\n/* ─── Career card stat bars ─── */\nconst cardIO = new IntersectionObserver((entries) => {\n  entries.forEach((e) => {\n    if (e.isIntersecting) {\n      e.target.classList.add('in');\n      cardIO.unobserve(e.target);\n    }\n  });\n}, { threshold: 0.3 });\ndocument.querySelectorAll('.career-card').forEach((c) => cardIO.observe(c));\n\n/* ─── Feedback modal ─── */\nconst fbBtn = document.getElementById('fbBtn');\nconst fbOverlay = document.getElementById('fbOverlay');\nconst fbForm = document.getElementById('fbForm');\nconst fbThanks = document.getElementById('fbThanks');\nfunction openFb() { fbOverlay.classList.add('open'); }\nfunction closeFb() { fbOverlay.classList.remove('open'); }\nfbBtn.addEventListener('click', openFb);\ndocument.getElementById('fbCancel').addEventListener('click', closeFb);\ndocument.getElementById('fbDone').addEventListener('click', () => {\n  closeFb();\n  fbForm.style.display = 'block';\n  fbThanks.style.display = 'none';\n});\nfbOverlay.addEventListener('click', (e) => { if (e.target === fbOverlay) closeFb(); });\nlet fbRelevance = null;\ndocument.querySelectorAll('.fb-options .fb-option').forEach((b) => {\n  b.addEventListener('click', () => {\n    b.parentElement.querySelectorAll('.fb-option').forEach((x) => x.classList.remove('active'));\n    b.classList.add('active');\n    fbRelevance = b.dataset.v;\n  });\n});\ndocument.getElementById('fbSubmit').addEventListener('click', () => {\n  const data = {\n    page: 'heartily-home',\n    relevance: fbRelevance,\n    interesting: document.getElementById('fbInteresting').value,\n    missing: document.getElementById('fbMissing').value,\n    ts: new Date().toISOString(),\n  };\n  console.log('[Heartily feedback]', data);\n  fbForm.style.display = 'none';\n  fbThanks.style.display = 'block';\n});\n<\u002Fscript>\n\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
